<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent Background -->
  
  <!-- Premium Gradients -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Logo Element -->
  <g transform="translate(250, 250)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#blueGradient)" stroke-width="8" />
    
    <!-- Inner Ring with subtle rotation -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.8" stroke-dasharray="2,6" />
    
    <!-- Central Element -->
    <g filter="url(#softGlow)">
      <!-- Diamond Shape -->
      <path d="M-60,-60 L0,-90 L60,-60 L0,-30 Z" fill="#0ea5e9" />
      
      <!-- Spade Shape -->
      <path d="M0,30 C0,0 -60,-10 -60,40 C-60,70 0,90 0,60 C0,90 60,70 60,40 C60,-10 0,0 0,30 Z" fill="#0ea5e9" />
      
      <!-- Connection Line -->
      <rect x="-5" y="-30" width="10" height="60" fill="#0ea5e9" />
    </g>
    
    <!-- Orbit Dots -->
    <circle cx="0" cy="-150" r="8" fill="#0ea5e9" />
    <circle cx="150" cy="0" r="8" fill="#0ea5e9" />
    <circle cx="0" cy="150" r="8" fill="#0ea5e9" />
    <circle cx="-150" cy="0" r="8" fill="#0ea5e9" />
  </g>
  
  <!-- Company Name -->
  <text x="250" y="375" font-family="Arial" font-size="50" font-weight="bold" text-anchor="middle" fill="#0ea5e9">FORTUNE</text>
</svg>
